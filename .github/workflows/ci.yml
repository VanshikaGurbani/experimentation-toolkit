name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[causal,serve,dev,notebooks]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (synthetic fixtures only, no dataset download needed)
        run: pytest
      - name: End-to-end smoke run of the whole pipeline on a synthetic fixture
        run: expkit run-all --fixture --out /tmp/expkit_out
      - name: Notebooks run end to end on the synthetic fixture (not the 14M real rows)
        run: expkit run-notebooks --fixture --out /tmp/expkit_notebooks
