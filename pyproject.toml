[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expkit"
version = "0.1.0"
description = "A/B testing toolkit: power, SRM, CUPED, decision rule, uplift modeling with Qini curves"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "duckdb==2.0.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "pyarrow==26.0.1",
]

[project.optional-dependencies]
causal = ["econml==0.17.0"]
serve = ["streamlit==1.67.0"]
dev = ["pytest==9.2.0", "ruff==0.17.5", "statsmodels==0.15.0"]
all = ["expkit[causal,serve,dev]"]

[project.scripts]
expkit = "expkit.cli:main"

[tool.setuptools]
packages = ["expkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"expkit/report.py" = ["E501"]
